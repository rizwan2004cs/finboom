<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f8fa"/>
      <stop offset="100%" stop-color="#e8e8ed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d1d1f"/>
      <stop offset="100%" stop-color="#3a3a3c"/>
    </linearGradient>
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <radialGradient id="orb" cx="0.38" cy="0.32" r="0.55">
      <stop offset="0%" stop-color="#6ee78a"/>
      <stop offset="50%" stop-color="#34c759"/>
      <stop offset="100%" stop-color="#1a8a38"/>
    </radialGradient>
    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="106" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <rect width="512" height="512" rx="108" fill="url(#glow)"/>

  <g filter="url(#fShadow)">
    <path d="M168 130 h176 v44 H220 v56 h100 v44 H220 v108 h-52 V130z" fill="url(#fGrad)"/>
  </g>

  <g filter="url(#orbGlow)">
    <circle cx="380" cy="138" r="44" fill="url(#orb)"/>
    <ellipse cx="370" cy="124" rx="18" ry="12" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>
