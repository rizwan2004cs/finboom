<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient for depth -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="100%" stop-color="#111113"/>
    </linearGradient>
    <!-- Inner glow -->
    <radialGradient id="glow" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- F letter gradient (top-lit) -->
    <linearGradient id="fGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b0b0b8"/>
    </linearGradient>
    <!-- F letter shadow -->
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <!-- Green orb gradient (3D sphere) -->
    <radialGradient id="orb" cx="0.38" cy="0.32" r="0.55">
      <stop offset="0%" stop-color="#80f09a"/>
      <stop offset="50%" stop-color="#34c759"/>
      <stop offset="100%" stop-color="#1a8a38"/>
    </radialGradient>
    <!-- Orb outer glow -->
    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Edge highlight for bevel -->
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Base shape with gradient -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Bevel edge highlight -->
  <rect x="2" y="2" width="508" height="508" rx="106" fill="none" stroke="url(#edge)" stroke-width="2.5"/>
  <!-- Inner glow overlay -->
  <rect width="512" height="512" rx="108" fill="url(#glow)"/>

  <!-- 3D "F" letter with shadow + gradient fill -->
  <g filter="url(#fShadow)">
    <path d="M168 130 h176 v44 H220 v56 h100 v44 H220 v108 h-52 V130z" fill="url(#fGrad)"/>
  </g>

  <!-- 3D green orb -->
  <g filter="url(#orbGlow)">
    <circle cx="380" cy="138" r="44" fill="url(#orb)"/>
    <!-- Specular highlight on orb -->
    <ellipse cx="370" cy="124" rx="18" ry="12" fill="#ffffff" opacity="0.45"/>
  </g>
</svg>
