name: 💡 Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Have an idea? Please check the [Roadmap](../../blob/master/ROADMAP.md) and existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What pain point or user need is behind this request?
      placeholder: As a user, I find it hard to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, or examples from other apps.
    validations:
      required: false
