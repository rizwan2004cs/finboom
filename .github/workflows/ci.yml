name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    name: Type check & lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Lint currently has known findings from the new React Compiler rules
      # (see CONTRIBUTING.md → "good first issues"). It is reported but does not
      # fail the build yet — remove `continue-on-error` once the backlog is cleared.
      - name: Lint
        run: npm run lint
        continue-on-error: true
